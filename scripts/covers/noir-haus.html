<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&display=block" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
  :root {
    --bg: radial-gradient(ellipse 900px 700px at 70% 45%, #1C1A1F 0%, #000 70%);
    --ink: #EDE9E3;
    --muted: #8E8A86;
    --silver: #C9C4BD;
    --shadow: rgba(0, 0, 0, .8);
  }
  .serif { font-family: 'Cormorant Garamond', serif; }

  /* Runway: three looks as tall frames, fanned */
  .looks { position: absolute; left: 700px; top: 70px; width: 860px; height: 1000px; }
  .look {
    position: absolute; width: 330px; height: 587px;
    border-radius: 6px; overflow: hidden;
    box-shadow: 0 50px 90px -20px rgba(0, 0, 0, .9), 0 0 0 1px rgba(255, 255, 255, .08);
  }
  .look img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .look.l1 { left: 0;     top: 150px; transform: rotate(-5deg); opacity: .8; }
  .look.l3 { left: 470px; top: 140px; transform: rotate(5deg);  opacity: .8; }
  .look.l2 { left: 240px; top: 60px;  width: 360px; height: 640px; z-index: 2; }

  /* Invitation card */
  .invite {
    width: 540px; padding: 44px 48px 40px;
    background: #F4F1EC;
    color: #111;
    border-radius: 4px;
    transform: rotate(-3deg);
    position: relative;
  }
  .invite::after { /* inner hairline frame, like a letterpress card */
    content: ''; position: absolute; inset: 12px;
    border: 1px solid rgba(17, 17, 17, .25); pointer-events: none;
  }
  .invite-house { font-size: 15px; letter-spacing: .35em; text-align: center; }
  .invite-lede { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 24px; text-align: center; margin-top: 26px; color: #444; }
  .invite-title { font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 64px; line-height: 1; text-align: center; margin-top: 8px; letter-spacing: -.01em; }
  .invite-title em { display: block; font-size: 40px; font-weight: 400; margin-top: 8px; }
  .invite-meta { display: grid; grid-template-columns: 1fr 1fr 1fr; margin-top: 32px; border-top: 1px solid rgba(17, 17, 17, .2); padding-top: 18px; text-align: center; }
  .invite-meta dt { font-size: 12px; color: #777; margin-bottom: 4px; }
  .invite-meta dd { font-size: 16px; font-weight: 600; }

  .object { top: 210px; }
  .caption h1 { font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 50px; letter-spacing: -.01em; line-height: 1; }
</style>
</head>
<body>
  <div class="name">NØIR HAUS</div>
  <div class="looks">
    <div class="look l1"><img src="../../public/images/projects/noir-haus/noir-haus-aw26-clown.webp" alt=""></div>
    <div class="look l3"><img src="../../public/images/projects/noir-haus/noir-haus-aw26-heritage.webp" alt=""></div>
    <div class="look l2"><img src="../../public/images/projects/noir-haus/noir-haus-aw26-dentelle.webp" alt=""></div>
  </div>

  <div class="object">
    <div class="invite">
      <div class="invite-house">NØIR HAUS</div>
      <div class="invite-lede">vous convie au défilé</div>
      <div class="invite-title">Automne–Hiver<em>2026</em></div>
      <dl class="invite-meta">
        <div><dt>Looks</dt><dd>4</dd></div>
        <div><dt>Lieu</dt><dd>WebGL</dd></div>
        <div><dt>Entrée</dt><dd>Au scroll</dd></div>
      </dl>
    </div>
  </div>

  <div class="caption">
    <h1>Un défilé de haute couture, en 3D dans le navigateur.</h1>
    <p>Quatre looks CLO3D, caméra orbitale et post-FX. Three.js, GSAP et Web Audio.</p>
  </div>
</body>
</html>
