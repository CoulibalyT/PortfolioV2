<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  @font-face {
    font-family: 'Geist';
    src: url('../../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2') format('woff2');
    font-weight: 100 900;
  }
  :root {
    --sky-top: #BFDDE9;
    --sky-bottom: #F3F8FA;
    --teal: #3E8FAF;
    --navy: #0F1B2D;
    --ink: #0F1B2D;
    --muted: #5E6E7E;
    --paper: #FFFFFF;
    --rule: #DCE6EB;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1600px; height: 1000px; overflow: hidden; }
  body {
    font-family: 'Geist', sans-serif;
    color: var(--navy);
    background: linear-gradient(180deg, var(--sky-top) 0%, #DCECF2 45%, var(--sky-bottom) 100%);
    position: relative;
    font-feature-settings: 'tnum' 1;
  }

  /* Flight path: from the pass to the destination screen */
  .route { position: absolute; inset: 0; pointer-events: none; }

  /* Browser + real screenshot */
  .browser {
    position: absolute;
    left: 600px; top: 170px;
    width: 1400px;
    border-radius: 16px;
    background: var(--paper);
    box-shadow: 0 40px 80px -30px rgba(15, 27, 45, .35), 0 0 0 1px rgba(15, 27, 45, .06);
    overflow: hidden;
  }
  .browser-bar {
    height: 44px;
    display: flex; align-items: center; gap: 16px;
    padding: 0 18px;
    border-bottom: 1px solid var(--rule);
    background: #F7FAFB;
  }
  .dots { display: flex; gap: 7px; }
  .dots i { width: 11px; height: 11px; border-radius: 50%; background: #D5DEE3; display: block; }
  .url {
    flex: 0 1 380px; margin: 0 auto;
    height: 26px; border-radius: 8px; background: #EAF1F4;
    font-size: 14px; color: var(--muted);
    display: flex; align-items: center; justify-content: center;
  }
  .browser img { display: block; width: 100%; }

  /* Boarding pass — the one bold element */
  .pass {
    position: absolute;
    left: 88px; top: 250px;
    width: 600px;
    display: flex;
    filter: drop-shadow(0 30px 40px rgba(15, 27, 45, .22)) drop-shadow(0 2px 4px rgba(15, 27, 45, .08));
    transform: rotate(-3deg);
  }
  .pass-main, .pass-stub {
    background: var(--paper);
    position: relative;
  }
  .pass-main {
    flex: 1;
    border-radius: 22px 0 0 22px;
    padding: 30px 34px 30px;
    /* notches cut where the stub tears off */
    -webkit-mask: radial-gradient(circle 14px at 100% 0, transparent 13.5px, #000 14px) top right / 100% 51% no-repeat,
                  radial-gradient(circle 14px at 100% 100%, transparent 13.5px, #000 14px) bottom right / 100% 51% no-repeat;
  }
  .pass-stub {
    width: 150px;
    border-radius: 0 22px 22px 0;
    border-left: 2px dashed var(--rule);
    padding: 30px 22px;
    display: flex; flex-direction: column; justify-content: space-between;
    -webkit-mask: radial-gradient(circle 14px at 0 0, transparent 13.5px, #000 14px) top left / 100% 51% no-repeat,
                  radial-gradient(circle 14px at 0 100%, transparent 13.5px, #000 14px) bottom left / 100% 51% no-repeat;
  }
  .pass-head { display: flex; justify-content: space-between; align-items: baseline; }
  .logo { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
  .logo span { color: var(--teal); }
  .pass-kind { font-size: 14px; color: var(--muted); }

  .route-codes {
    display: grid; grid-template-columns: auto 1fr auto; align-items: center;
    gap: 18px; margin: 30px 0 26px;
  }
  .code { font-size: 84px; font-weight: 800; letter-spacing: -.04em; line-height: .9; }
  .code small { display: block; font-size: 15px; font-weight: 500; letter-spacing: 0; color: var(--muted); margin-top: 10px; }
  .code.to { text-align: right; }
  .flight {
    height: 2px;
    background: repeating-linear-gradient(90deg, var(--teal) 0 8px, transparent 8px 14px);
    position: relative; top: -14px;
  }
  .flight svg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--paper); padding: 0 8px; box-sizing: content-box; }

  .fields { display: grid; grid-template-columns: 1.3fr 1fr .8fr; gap: 16px; border-top: 1px solid var(--rule); padding-top: 20px; }
  .field dt { font-size: 13px; color: var(--muted); margin-bottom: 5px; }
  .field dd { font-size: 19px; font-weight: 650; }

  .stub-block dt { font-size: 13px; color: var(--muted); margin-bottom: 5px; }
  .stub-block dd { font-size: 19px; font-weight: 650; }
  .barcode {
    height: 86px;
    background: repeating-linear-gradient(90deg,
      var(--navy) 0 3px, transparent 3px 5px, var(--navy) 5px 6px, transparent 6px 9px,
      var(--navy) 9px 13px, transparent 13px 15px, var(--navy) 15px 16px, transparent 16px 20px);
    border-radius: 2px;
  }

  /* Caption */
  .caption { position: absolute; left: 96px; bottom: 88px; width: 460px; }
  .caption h1 { font-size: 40px; font-weight: 700; letter-spacing: -.03em; line-height: 1.05; text-wrap: balance; }
  .caption p { margin-top: 14px; font-size: 19px; line-height: 1.45; color: var(--muted); }
</style>
</head>
<body>
  <div class="name">Skywalk</div>

  <svg class="route" width="1600" height="1000" viewBox="0 0 1600 1000">
    <path d="M 640 110 C 800 30, 1000 40, 1180 110" fill="none" stroke="#3E8FAF" stroke-opacity=".45" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round"/>
    <circle cx="640" cy="110" r="5" fill="#3E8FAF" fill-opacity=".6"/>
    <circle cx="1180" cy="110" r="7" fill="none" stroke="#3E8FAF" stroke-opacity=".6" stroke-width="2"/>
    <circle cx="1180" cy="110" r="3" fill="#3E8FAF"/>
  </svg>

  <div class="browser">
    <div class="browser-bar">
      <div class="dots"><i></i><i></i><i></i></div>
      <div class="url">skywalk-chi.vercel.app</div>
    </div>
    <img src="../../public/images/projects/skywalk/destinations.webp" alt="">
  </div>

  <div class="pass">
    <div class="pass-main">
      <div class="pass-head">
        <div class="logo"><span>Sky</span>Walk</div>
        <div class="pass-kind">Carte d'embarquement</div>
      </div>
      <div class="route-codes">
        <div class="code">FRA<small>France</small></div>
        <div class="flight">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="#3E8FAF"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z" transform="rotate(90 12 12)"/></svg>
        </div>
        <div class="code to">USA<small>États-Unis</small></div>
      </div>
      <dl class="fields">
        <div class="field"><dt>Passager</dt><dd>Tene Coulibaly</dd></div>
        <div class="field"><dt>Départ</dt><dd>01 JAN 2028</dd></div>
        <div class="field"><dt>Checklist</dt><dd>2/38</dd></div>
      </dl>
    </div>
    <div class="pass-stub">
      <dl class="stub-block"><dt>Séjour</dt><dd>3 ans +</dd></dl>
      <div class="barcode"></div>
    </div>
  </div>

  <div class="caption">
    <h1>Préparer son expatriation, étape par étape.</h1>
    <p>Destinations, emploi, coût de la vie et forum modéré par IA. React, NestJS et 8 API externes.</p>
  </div>

</body>
</html>
